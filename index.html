<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experiencias de Vida</title><style>body{font-family:system-ui;background:#f6f8fb;color:#172338;margin:0}header{background:#132a47;color:white;padding:36px 20px}main{max-width:900px;margin:auto;padding:20px}h1{margin:0 0 10px}input{box-sizing:border-box;width:100%;padding:15px;border:1px solid #ccd4df;border-radius:12px;font-size:16px}.card{background:white;border:1px solid #e1e5ed;border-radius:12px;padding:15px;margin:10px 0}.meta{color:#63748b;font-size:13px}.note{background:#fff6e2;padding:16px;border-radius:12px;margin:20px 0}button{background:#193c6a;color:white;border:0;border-radius:9px;padding:10px;cursor:pointer}</style></head><body><header><main><h1>🌎 Experiencias de Vida</h1><p>Un recorrido por mis viajes, espectáculos, gastronomía y recuerdos.</p><strong>690 experiencias numeradas</strong></main></header><main><div class="note"><strong>Publicación inicial.</strong> Este sitio está activo, pero la migración del catálogo completo de la versión 6.0 está pendiente. No se inventan registros faltantes.</div><input id="q" placeholder="Buscar experiencias..." aria-label="Buscar"><p id="count"></p><div id="items"></div></main><script>const items=[{n:676,t:"El beso",d:"20/06/2024 · Teatro Astral, Buenos Aires · 2 entradas"},{n:687,t:"Ezequiel Campa — Cheto y Choto",d:"30/07/2022, 22:30 · Chacarerean Theatre · Platea fila 7, butacas 8 y 9"},{n:688,t:"El método Grönholm",d:"Domingo 19:45 · Paseo La Plaza · Platea central fila 3, butacas 8 y 10 · Fecha completa pendiente"},{n:689,t:"Los mosqueteros del rey",d:"10/09/2023, 18:30 · Teatro Astral · Super Pullman fila 2, butacas 12 y 14"},{n:690,t:"Permitidos",d:"12/02/2024, 20:15 · Paseo La Plaza · Platea central fila 11, butacas 1 y 3"}];const q=document.getElementById("q"),out=document.getElementById("items"),count=document.getElementById("count");function draw(){const s=q.value.toLowerCase(),a=items.filter(x=>(x.n+" "+x.t+" "+x.d).toLowerCase().includes(s));count.textContent=a.length+" fichas verificadas visibles en esta publicación inicial";out.innerHTML=a.map(x=>'<div class="card"><div class="meta">Experiencia N.º '+x.n+'</div><h3>'+x.t+'</h3><p>'+x.d+'</p></div>').join("")}q.addEventListener("input",draw);draw();</script></body></html>
